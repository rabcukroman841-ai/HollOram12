.pill{background:var(--pc);color:var(--opc);border-radius:100px;padding:2px 10px;font-size:12px}

#pp{position:fixed;inset:0;z-index:8;background:#0004;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

function authView(h){$('#auth').hidden=false;$('#main').hidden=true;$('#auth').innerHTML=`<div class="card gl">${FLW}<h1>HollOram</h1>${h}</div>`}
function welcome(){authView(`<p class="sub">Общайся. Делись. Будь ближе.</p><button class="btn" data-a="phone">Войти</button><button class="btn t" data-a="phone">Создать аккаунт</button>`)}
function stepPhone(e=''){authView(`<p class="sub">Введите номер телефона — мы отправим SMS с кодом</p><input id="ph" class="in" inputmode="tel" placeholder="+7 900 000-00-00" value="${E(ph)}"><p class="err">${E(e)}</p><button class="btn" data-a="sendcode">Получить код</button>`)}
async function sendcode(){let d=$('#ph')?.value.replace(/\\D/g,'')||ph;if(d.length==10)d='7'+d;d=d.replace(/^8/,'7');ph=d;
  if(!/^7\\d{10}$/.test(d))return stepPhone('Введите номер в формате +7 XXX XXX-XX-XX');
  if(d===ADMIN&&!owner)return stepPhone('Этот номер зарезервирован: вход невозможен');
  try{const p=await db.doc('phones/'+d).get();if(p.exists&&p.data().uid!==uid)return stepPhone('Номер уже привязан к другому аккаунту')}catch(e){return stepPhone('Нет связи с хранилищем')}
  if(me&&me.phone!==d)return stepPhone('К этому аккаунту привязан другой номер');
  try{await SMS.send(d);stepCode()}catch(e){stepPhone(e.message||'Не удалось отправить SMS. Проверьте настройки сервера.')}
}
function stepCode(e=''){authView(`<p class="sub">Код отправлен на +${E(ph)}</p><input id="cd" class="in" inputmode="numeric" maxlength="6" placeholder="••••••"><p class="err">${E(e)}</p><button class="btn" data-a="verify">Подтвердить</button><button class="btn t" data-a="sendcode">Отправить ещё раз</button><button class="btn t" data-a="phone">Изменить номер</button>`)}
function stepReg(e=''){authView(`<p class="sub">Создайте профиль</p><input id="nm" class="in" placeholder="Имя" value="${E(G.rn||'')}"><input id="un" class="in" placeholder="@имя_пользователя" value="${E(G.ru||'')}"><input id="bi" class="in" placeholder="О себе (необязательно)" value="${E(G.rb||'')}"><p class="err">${E(e)}</p><button class="btn" data-a="reg">Зарегистрироваться</button>`)}
async function verify(){try{await SMS.verify(ph,$('#cd').value.trim());if(me){LS.s('ho_in',1);return enter()}stepReg()}catch(e){stepCode(e.message||'Неверный или просроченный код')}}
async function reg(){const name=$('#nm').value.trim(),un=$('#un').value.trim().replace(/^@/,'').toLowerCase(),bio=$('#bi').value.trim();G={rn:name,ru:un,rb:bio};
 if(name.length<2)return stepReg('Введите имя');if(!/^[a-z0-9_]{4,20}$/.test(un))return stepReg('Ник: 4–20 символов a–z, 0–9, _');
 const s=await db.collection('users').where('un','==',un).get();if(!s.empty)return stepReg('Этот ник уже занят');
 me={uid,phone:ph,name,un,bio,av:'',vf:'',ph:{phone:'none',seen:'all',msg:'all',read:true},seen:Date.now(),ts:Date.now()};
 await db.doc('phones/'+ph).set({uid});await db.doc('users/'+uid).set(me);LS.s('ho_in',1);G={};enter()}
function enter(){$('#auth').hidden=true;$('#main').hidden=false;if(started)return render();started=1;
 db.collection('users').onSnapshot(s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());me=users[uid]||me;if(me.banned){document.body.innerHTML='<div id="auth"><div class="card gl"><h1>Аккаунт заблокирован</h1></div></div>';return}render();if(cur)head();if(page&&page!='newg'&&page!='editc'&&!document.activeElement?.closest('#set'))rpage()},e=>toast('Ошибка: '+e.code));
 db.collection('chats').where('members','array-contains',uid).onSnapshot(s=>{chats={};s.docs.forEach(d=>chats[d.id]=d.data());render();if(cur&&isG(cur))head()});
 db.collection('chats').where('pub','==',true).onSnapshot(s=>{pubs={};s.docs.forEach(d=>pubs[d.id]=d.data());render()});
 db.doc('meta/ann').onSnapshot(s=>{const t=s.exists?s.data().t:'';$('#ann').textContent=t||'';$('#ann').hidden=!t});
 const hb=()=>db.doc('users/'+uid).update({seen:Date.now()}).catch(()=>{});hb();setInterval(hb,60000);callsInit()}

 $('#pb').innerHTML=ic('plus');

 for(const raw of VT.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)){const q=raw.replace(/^@/,'').toLowerCase(),d=raw.replace(/\D/g,''),ph7=d.length==10?'7'+d:d.replace(/^8/,'7');
  const e=Object.entries(users).find(([i,u])=>u.un===q||(d.length>=10&&u.phone===ph7));
  if(e){const c0=vl(e[1]),nv=on?[...new Set([...c0,...ks])]:c0.filter(k=>!ks.includes(k));await db.doc('users/'+e[0]).update({vfs:nv,vf:''});n++;continue}
  const ge=Object.entries({...chats,...pubs}).find(([i,c])=>i.toLowerCase()===q||(c.name||'').toLowerCase()===q||(c.link||'').toLowerCase()===q||i.toLowerCase()===raw.toLowerCase());
  if(ge){const [id,c]=ge,c0=vl(c),nv=on?[...new Set([...c0,...ks])]:c0.filter(k=>!ks.includes(k));await db.doc('chats/'+id).update({vfs:nv,vf:''});n++}
 }
 if(!n)return toast('Не нашли пользователей, группы или каналы');
 const items=ks.map(k=>({label:VF[k][1],color:VF[k][0]}));if(!on)items.forEach(x=>x.label='Снята: '+x.label);awardAnimation(items,on);toast('Готово: обновлено '+n+' объект(ов)');render()}
/* ---------- звонки (WebRTC, сигналы через общее хранилище) ---------- */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},...(window.HO_TURN_SERVERS||[])]};
function callsInit(){const f=s=>{s.docs.forEach(d=>calls[d.id]=d.data());tab=='calls'&&render();s.docs.forEach(d=>{const c=d.data();if(c.to===uid&&c.st=='ring'&&Date.now()-c.ts<45000&&!CL)incoming(d.id,c)})};
 db.collection('calls').where('to','==',uid).onSnapshot(f);db.collection('calls').where('from','==',uid).onSnapshot(f)}
async function media(v){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:v?{facingMode:'user'}:false})}catch(e){toast('Нет доступа к '+(v?'камере и микрофону':'микрофону'));return null}}
function newPC(id,st){const pc=new RTCPeerConnection(ICE);st.getTracks().forEach(t=>pc.addTrack(t,st));pc.onicecandidate=e=>e.candidate&&db.collection('calls/'+id+'/c').add({by:uid,c:e.candidate.toJSON()});pc.ontrack=e=>{const v=$('#rvid');if(v){v.srcObject=e.streams[0];v.play().catch(()=>{})}};return pc}
function ui(inc,s){const o=CL.o,u=users[o];$('#cl').hidden=false;$('#cl').className=CL.video?'v':'';$('#cl').innerHTML=`<video id="rvid" autoplay playsinline ${CL.video?'':'hidden'}></video>${CL.video&&CL.st?'<video id="lvid" autoplay muted playsinline></video>':''}<div class="cc">${av(u,o,120)}<h2>${E(nm(o))}${bd(u)}</h2><p id="cst">${s}</p></div><div class="cb">${inc?`<button class="ib cr1" data-a="cdec">${ic('phone',28)}</button><button class="ib cg" data-a="cacc">${ic('phone',28)}</button>`:`<button class="ib" data-a="cmute">${ic('mic',24)}</button><button class="ib cr1" data-a="cend">${ic('phone',28)}</button>`}</div>`;if($('#lvid'))$('#lvid').srcObject=CL.st}
async function flush(){while(CL?.pc&&CL.pc.remoteDescription&&CL.q.length){try{await CL.pc.addIceCandidate(CL.q.shift())}catch(e){}}}
function watch(id,caller){const seen={};
 const u1=db.doc('calls/'+id).onSnapshot(async s=>{const c=s.data();if(!c||!CL||CL.id!==id)return;if(c.st=='ended')return hang(false);
  if(caller&&c.answer&&!CL.ans){CL.ans=1;try{await CL.pc.setRemoteDescription(c.answer);await flush();tick()}catch(e){}}});
 const u2=db.collection('calls/'+id+'/c').onSnapshot(s=>{if(!CL||CL.id!==id)return;s.docs.forEach(d=>{const x=d.data();if(x.by!==uid&&!seen[d.id]){seen[d.id]=1;CL.q.push(x.c)}});flush()});
 CL.un=[u1,u2]}
function tick(){if(!CL)return;CL.t0=Date.now();if($('#cst'))$('#cst').textContent='0:00';CL.iv=setInterval(()=>{if(CL&&$('#cst'))$('#cst').textContent=F(Math.round((Date.now()-CL.t0)/1000))},1000)}
function hang(send=true){if(!CL)return;const c=CL;CL=null;clearInterval(c.iv);clearTimeout(c.to);(c.un||[]).forEach(f=>f());c.pc?.close();c.st?.getTracks().forEach(t=>t.stop());$('#cl').hidden=true;$('#cl').innerHTML='';send&&db.doc('calls/'+c.id).update({st:'ended',end:Date.now()}).catch(()=>{})}
async function call(o,video){if(CL||isG(o)||o===uid)return toast(CL?'Вы уже в звонке':'Звонок недоступен');const st=await media(video);if(!st)return;
 const id=uid+'_'+Date.now();CL={id,o,video,st,q:[]};CL.pc=newPC(id,st);ui(0,'Вызов…');watch(id,1);
 CL.to=setTimeout(()=>{if(CL&&CL.id===id&&!CL.ans)hang()},45000);
 try{const off=await CL.pc.createOffer();await CL.pc.setLocalDescription(off);await db.doc('calls/'+id).set({from:uid,to:o,video:!!video,st:'ring',ts:Date.now(),offer:{type:off.type,sdp:off.sdp}})}catch(e){toast('Не удалось позвонить');hang(false)}}
function incoming(id,c){CL={id,o:c.from,video:c.video,q:[]};ui(1,c.video?'Видеозвонок…':'Входящий звонок…');watch(id,0)}
async function accept(){const c=calls[CL.id],st=await media(c.video);if(!st)return hang();CL.st=st;ui(0,'Соединение…');CL.pc=newPC(CL.id,st);
 try{await CL.pc.setRemoteDescription(c.offer);await flush();const an=await CL.pc.createAnswer();await CL.pc.setLocalDescription(an);await db.doc('calls/'+CL.id).update({st:'on',ans:true,answer:{type:an.type,sdp:an.sdp}});CL.ans=1;tick()}catch(e){toast('Ошибка соединения');hang()}}
/* ---------- запуск ---------- */
(async()=>{theme();icons();
 hasC=typeof claude!=='undefined';
 if(hasC){db=await claude.use('db');user=await claude.use('user');if(!db||!user)return authView('<p class="sub">Войдите в аккаунт Claude, чтобы пользоваться мессенджером</p>')}
 else if(window.HO_FIREBASE_CONFIG&&window.HO_FIREBASE_CONFIG.apiKey&&window.firebase){try{if(!firebase.apps.length)firebase.initializeApp(window.HO_FIREBASE_CONFIG);await firebase.auth().signInAnonymously();db=firebase.firestore();const fu=firebase.auth().currentUser;user={id:async()=>fu.uid,isOwner:async()=>true}}catch(e){console.error(e);return authView('<p class="sub">Не удалось подключить Firebase. Проверьте firebase-config.js и включите Anonymous Authentication.</p>')}}
 else{db=localDB();let i=LS.g('ho_uid',0);if(!i)LS.s('ho_uid',i='u'+Math.random().toString(36).slice(2,10));user={id:async()=>i,isOwner:async()=>true};if(!window.HO_API_BASE)console.warn('SMS backend is not configured: set HO_API_BASE.')}
 uid=await user.id();owner=await user.isOwner();try{AS=!!(hasC&&await claude.use('assets'))}catch(e){}
 try{const s=await db.doc('users/'+uid).get();if(s.exists)me=s.data()}catch(e){}
 if(me&&LS.g('ho_in',0)){if(me.banned){authView('<h1>Аккаунт заблокирован</h1>');return}enter()}else welcome()})();
</script>
